<!doctype html>
<html lang="fr">
<head><meta charset="UTF-8"><title>Messenger Emoji - Tests</title><link rel="stylesheet" href="../extension/content.css"></head>
<body>
  <h1>Tests Messenger Emoji</h1>
  <pre id="results"></pre>
  <button id="test-suggestions" type="button">Tester les suggestions</button>
  <pre id="suggestion-results"></pre>
  <div id="editor" role="textbox" aria-multiline="true" data-lexical-editor="true" contenteditable="true" style="border: 1px solid; min-height: 60px"></div>
  <div id="search" role="textbox" contenteditable="true" style="border: 1px solid; min-height: 30px"></div>
  <script src="../extension/rules.js"></script>
  <script>
    const storageListeners = [];
    globalThis.chrome = {
      storage: {
        local: { get: async () => ({ settings: MessengerEmojiRules.defaults }) },
        onChanged: { addListener: (listener) => storageListeners.push(listener) }
      }
    };
    const { defaults, normalizeSettings, findReplacement, findSuggestions } = MessengerEmojiRules;
    const results = [];
    function check(name, condition) {
      results.push({ name, passed: Boolean(condition) });
      if (!condition) throw new Error(name);
    }
    check("Completed shortcut", findReplacement("Salut :sob:", defaults)?.emoji === "\uD83D\uDE2D");
    check("Partial shortcut", findReplacement(":so", defaults) === null);
    check("Caret only", findReplacement(":sob: suite", defaults) === null);
    check("Disabled", findReplacement(":sob:", { ...defaults, enabled: false }) === null);
    check("Suggestions for colon", findSuggestions(":", defaults)?.mappings.length === 5);
    check("Suggestions filtered", findSuggestions(":c", defaults)?.mappings[0].shortcut === ":cwl:");
    check("Suggestions disabled", findSuggestions(":", { ...defaults, enabled: false }) === null);
    check("Empty mappings preserved", normalizeSettings({ mappings: [] }).mappings.length === 0);
    const custom = { enabled: true, mappings: [
      { shortcut: ")", emoji: "short" }, { shortcut: "(a+b)", emoji: "long" },
      { shortcut: "cool", emoji: "\uD83D\uDE0E" }
    ] };
    check("Longest literal shortcut", findReplacement("(a+b)", custom)?.emoji === "long");
    check("Word boundary", findReplacement("uncool", custom) === null);
    check("Custom plain word", findReplacement("C'est cool", custom)?.emoji === "\uD83D\uDE0E");
    check("Case sensitive", findReplacement("COOL", custom) === null);
    check("Invalid and duplicate mappings", normalizeSettings({ mappings: [null,
      { shortcut: "", emoji: "x" }, { shortcut: "a", emoji: "x" },
      { shortcut: "a", emoji: "y" }
    ] }).mappings.length === 1);
    document.querySelector("#results").textContent = results.map(result => "PASS " + result.name).join("\n");
    globalThis.testResults = results;
    globalThis.changeSettings = (settings) => storageListeners.forEach(listener => listener({ settings: { newValue: settings } }, "local"));
    globalThis.inputCommitChecks = [];
    document.querySelector("#editor").addEventListener("input", (event) => {
      event.stopPropagation();
      if (event.inputType === "insertText" && event.data === ":") {
        queueMicrotask(() => {
          const selection = getSelection();
          const prefix = document.createRange();
          prefix.selectNodeContents(event.target);
          prefix.setEnd(selection.anchorNode, selection.anchorOffset);
          inputCommitChecks.push(prefix.toString().endsWith(":"));
        });
      }
    });
  </script>
  <script src="../extension/content.js"></script>
  <script>
    document.querySelector("#test-suggestions").addEventListener("click", async () => {
      const output = document.querySelector("#suggestion-results");
      const editor = document.createElement("div");
      editor.contentEditable = "true";
      editor.setAttribute("role", "textbox");
      editor.setAttribute("aria-multiline", "true");
      document.body.append(editor);
      const wait = () => new Promise((resolve) => setTimeout(resolve, 0));
      const pressKey = (target, key, options = {}) => {
        const event = new KeyboardEvent("keydown", {
          key, bubbles: true, cancelable: true, ...options
        });
        target.dispatchEvent(event);
        return event;
      };
      const assert = (condition, message) => {
        if (!condition) throw new Error(message);
      };
      let editorEnterCount = 0;
      editor.addEventListener("keydown", (event) => {
        if (event.key === "Enter") editorEnterCount += 1;
      });
      try {
        editor.focus();
        assert(document.execCommand("insertText", false, ":"), "Saisie de : impossible");
        await wait();
        const panel = document.querySelector(".messenger-emoji-suggestions");
        assert(!panel.hidden && panel.querySelectorAll("button").length === 5, "Suggestions initiales");
        assert(document.execCommand("insertText", false, "c"), "Saisie de c impossible");
        await wait();
        const buttons = panel.querySelectorAll("button");
        assert(buttons.length === 1 && buttons[0].textContent.includes(":cwl:"), "Filtrage");
        buttons[0].click();
        assert(editor.textContent === "\uD83D\uDE02" && panel.hidden, "Insertion par clic");

        editor.textContent = "";
        editor.focus();
        assert(document.execCommand("insertText", false, ":s"), "Saisie de :s impossible");
        await wait();
        assert(!panel.hidden && panel.querySelectorAll("button").length === 2, "Suggestions pour :s");
        const enterOnOpen = pressKey(editor, "Enter");
        assert(enterOnOpen.defaultPrevented && editorEnterCount === 0, "Entrée ne doit pas envoyer le message");
        assert(editor.textContent === "\uD83D\uDE2D" && panel.hidden, "Validation du premier emoji par Entrée");

        const enterWhenClosed = pressKey(editor, "Enter");
        assert(!enterWhenClosed.defaultPrevented && editorEnterCount === 1, "Entrée normale hors bandeau");

        editor.textContent = "";
        editorEnterCount = 0;
        editor.focus();
        assert(document.execCommand("insertText", false, ":h"), "Saisie rapide de :h impossible");
        const fastEnter = pressKey(editor, "Enter");
        assert(fastEnter.defaultPrevented && editorEnterCount === 0 &&
          editor.textContent === "\u2764\uFE0F" && panel.hidden, "Validation immédiate par Entrée");

        editor.textContent = "";
        editor.focus();
        assert(document.execCommand("insertText", false, ":s"), "Saisie de :s pour Shift+Entrée impossible");
        await wait();
        const shiftEnter = pressKey(editor, "Enter", { shiftKey: true });
        assert(!shiftEnter.defaultPrevented && editorEnterCount === 1, "Shift+Entrée préservé");

        const escapeEvent = pressKey(editor, "Escape");
        assert(escapeEvent.defaultPrevented && panel.hidden, "Fermeture par Échap");
        const enterAfterEscape = pressKey(editor, "Enter");
        assert(!enterAfterEscape.defaultPrevented && editorEnterCount === 2, "Entrée après Échap autorisée");

        editor.textContent = "";
        editorEnterCount = 0;
        editor.focus();
        assert(document.execCommand("insertText", false, ":s"), "Saisie de :s pour Tab impossible");
        await wait();
        const secondButton = panel.querySelectorAll("button")[1];
        secondButton.focus();
        const enterOnFocusedButton = pressKey(secondButton, "Enter");
        assert(enterOnFocusedButton.defaultPrevented && editorEnterCount === 0 &&
          editor.textContent === "\uD83D\uDE0A" && panel.hidden, "Validation du bouton ciblé par Tab+Entrée");

        editor.textContent = "";
        editor.focus();
        assert(document.execCommand("insertText", false, ":"), "Nouvelle saisie impossible");
        await wait();
        changeSettings({ ...defaults, enabled: false });
        assert(panel.hidden, "Désactivation");
        output.textContent = "PASS Suggestions, filtrage, validation par Entrée, clic et désactivation";
      } catch (error) {
        output.textContent = "FAIL " + error.message;
      } finally {
        editor.remove();
        changeSettings(defaults);
      }
    });
  </script>
</body>
</html>
