<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Messenger Emoji</title>
  <link rel="stylesheet" href="options.css">
  <script src="rules.js" defer></script>
  <script src="options.js" defer></script>
</head>
<body>
  <main>
    <header class="header">
      <div class="brand-mark" aria-hidden="true">&#128172;</div>
      <div class="brand-copy">
        <p class="eyebrow">MESSENGER WEB</p>
        <h1>Mes raccourcis emoji</h1>
      </div>
    </header>
    <form id="settings-form" novalidate>
      <section class="activation">
        <span id="activation-label">Remplacement automatique</span>
        <label class="switch">
          <input id="enabled" type="checkbox" role="switch" aria-labelledby="activation-label" disabled>
          <span class="switch-track" aria-hidden="true"></span>
        </label>
      </section>
      <section class="mappings-section" aria-labelledby="mappings-title">
        <div class="section-heading">
          <h2 id="mappings-title">Mes associations</h2>
          <span id="mapping-count" class="count">0</span>
          <button id="add" type="button" class="icon-button" title="Ajouter une association" aria-label="Ajouter une association" disabled>
            <img src="icons/plus.svg" alt="" width="18" height="18">
          </button>
        </div>
        <div class="column-labels" aria-hidden="true"><span>Texte</span><span>Emoji</span><span></span></div>
        <div id="mappings"></div>
        <p id="empty" class="empty" hidden>Aucune association.</p>
      </section>
      <footer class="footer">
        <button id="reset" type="button" class="icon-button" title="R&eacute;tablir les associations par d&eacute;faut" aria-label="R&eacute;tablir les associations par d&eacute;faut" disabled>
          <img src="icons/rotate-ccw.svg" alt="" width="18" height="18">
        </button>
        <p id="status" role="status" aria-live="polite">Chargement...</p>
        <button id="save" type="submit" class="save-button" disabled>
          <img src="icons/save.svg" alt="" width="17" height="17">Enregistrer
        </button>
      </footer>
    </form>
  </main>
  <template id="mapping-template">
    <div class="mapping-row">
      <input class="shortcut-input" type="text" placeholder="(sob)" maxlength="80" required autocomplete="off" spellcheck="false" aria-label="Texte du raccourci">
      <input class="emoji-input" type="text" placeholder="&#128557;" maxlength="80" required autocomplete="off" spellcheck="false" aria-label="Emoji de remplacement">
      <button class="delete-button icon-button" type="button" title="Supprimer cette association" aria-label="Supprimer cette association">
        <img src="icons/trash-2.svg" alt="" width="17" height="17">
      </button>
    </div>
  </template>
</body>
</html>
