<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Messenger Emoji</title>
  <link rel="stylesheet" href="options.css">
  <script src="rules.js" defer></script>
  <script src="catalog.js" defer></script>
  <script src="options.js" defer></script>
</head>
<body>
  <main>
    <header class="header">
      <div class="brand-mark" aria-hidden="true">&#128172;</div>
      <div class="brand-copy">
        <p class="eyebrow">MESSENGER WEB</p>
        <h1 data-i18n="heading">My emoji shortcuts</h1>
      </div>
    </header>
    <form id="settings-form" novalidate>
      <section class="activation">
        <span id="activation-label" data-i18n="activation">Automatic replacement</span>
        <label class="switch">
          <input id="enabled" type="checkbox" role="switch" aria-labelledby="activation-label" disabled>
          <span class="switch-track" aria-hidden="true"></span>
        </label>
      </section>
      <section class="mappings-section" aria-labelledby="mappings-title">
        <div class="section-heading">
          <h2 id="mappings-title" data-i18n="mappingsTitle">My mappings</h2>
          <span id="mapping-count" class="count">0</span>
          <button id="add" type="button" class="icon-button" title="Add a mapping" aria-label="Add a mapping" data-i18n-title="addMapping" data-i18n-aria-label="addMapping" disabled>
            <img src="icons/plus.svg" alt="" width="18" height="18">
          </button>
        </div>
        <label class="mapping-search-label" for="mapping-search" data-i18n="searchMappings">Search my mappings</label>
        <input id="mapping-search" type="search" placeholder="Shortcut or emoji" data-i18n-placeholder="searchPlaceholder" autocomplete="off" disabled>
        <div class="column-labels" aria-hidden="true"><span data-i18n="columnText">Text</span><span data-i18n="columnEmoji">Emoji</span><span></span></div>
        <div id="mappings"></div>
        <p id="empty" class="empty" data-i18n="noMappings" hidden>No mappings.</p>
        <p id="search-empty" class="empty" data-i18n="noSearchResults" hidden>No matches.</p>
        <div class="catalog-tools">
          <div class="catalog-buttons">
            <button id="refresh-catalog" type="button" class="secondary-button" data-i18n="refreshCatalog" disabled>Refresh catalogue</button>
            <button id="import-catalog" type="button" class="secondary-button" data-i18n="importMissing" disabled>Import missing emojis</button>
          </div>
          <p id="catalog-status" role="status" aria-live="polite" data-i18n="catalogLoading">Loading catalogue...</p>
          <p class="catalog-credit" data-i18n="catalogCredit">Unicode Emoji catalogue. Your mappings stay on this device.</p>
        </div>
      </section>
      <footer class="footer">
        <button id="reset" type="button" class="icon-button" title="Restore default mappings" aria-label="Restore default mappings" data-i18n-title="resetDefaults" data-i18n-aria-label="resetDefaults" disabled>
          <img src="icons/rotate-ccw.svg" alt="" width="18" height="18">
        </button>
        <button id="clear-all" type="button" class="clear-all-button" title="Delete all mappings" data-i18n-title="clearAllTitle" disabled>
          <img src="icons/trash-2.svg" alt="" width="16" height="16"><span data-i18n="clearAllButton">Clear all</span>
        </button>
        <p id="status" role="status" aria-live="polite" data-i18n="statusLoading">Loading...</p>
        <button id="save" type="submit" class="save-button" disabled>
          <img src="icons/save.svg" alt="" width="17" height="17"><span data-i18n="save">Save</span>
        </button>
      </footer>
    </form>
  </main>
  <template id="mapping-template">
    <div class="mapping-row">
      <input class="shortcut-input" type="text" placeholder=":sob:" maxlength="80" required autocomplete="off" spellcheck="false" aria-label="Shortcut text" data-i18n-aria-label="shortcutInputLabel">
      <input class="emoji-input" type="text" placeholder="&#128557;" maxlength="80" required autocomplete="off" spellcheck="false" aria-label="Replacement emoji" data-i18n-aria-label="emojiInputLabel">
      <button class="delete-button icon-button" type="button" title="Delete mapping" aria-label="Delete mapping" data-i18n-title="deleteMapping" data-i18n-aria-label="deleteMapping">
        <img src="icons/trash-2.svg" alt="" width="17" height="17">
      </button>
    </div>
  </template>
</body>
</html>
